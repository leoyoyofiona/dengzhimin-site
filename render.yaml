# Render Blueprint —— 一键部署 dengzhimin.cn（Astro 静态站 + 留言板 API）
# 用法：把本仓库推到 GitHub 后，在 Render 上 Import 这个仓库
# 会自动按此配置创建服务，构建产物为 ./dist
services:
  - type: web
    name: dengzhimin-site
    runtime: static
    rootDir: .
    buildCommand: rm -rf dist .astro && npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  # 留言板 API（匿名留言，全站共享）
  - type: web
    name: dengzhimin-guestbook-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: guestbook-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /opt/render/project/src/data/guestbook.json
