<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#111827">2026年9月第1周 · 前沿模型与世界模型发布时间线</text>
  <text x="24" y="55" font-size="12" fill="#6b7280">依据各厂商官方公告日期绘制 · 本简报自制图，非原文配图</text>

  <!-- axis -->
  <line x1="60" y1="120" x2="720" y2="120" stroke="#d1d5db" stroke-width="2"/>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="140" y="145">9月1日（周二）</text>
    <text x="360" y="145">9月2日（周三）</text>
    <text x="580" y="145">9月3—4日（周四—五）</text>
  </g>
  <g fill="#2563eb">
    <circle cx="140" cy="120" r="7"/>
    <circle cx="360" cy="120" r="7"/>
    <circle cx="580" cy="120" r="7"/>
  </g>

  <!-- cards -->
  <g>
    <rect x="30" y="165" width="215" height="140" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="44" y="188" font-size="13" font-weight="700" fill="#1e40af">Anthropic</text>
    <text x="44" y="208" font-size="12" fill="#374151">Claude Fable 5.1 / Mythos 5.1</text>
    <text x="44" y="226" font-size="11" fill="#6b7280">1M 上下文 · 缓存读取降价 75%</text>
    <text x="44" y="242" font-size="11" fill="#6b7280">Mythos 5.1 受审核组织门控</text>
    <line x1="44" y1="254" x2="231" y2="254" stroke="#bfdbfe"/>
    <text x="44" y="273" font-size="13" font-weight="700" fill="#1e40af">World Labs</text>
    <text x="44" y="291" font-size="12" fill="#374151">Atlas 全模态世界模型</text>
  </g>

  <g>
    <rect x="255" y="165" width="215" height="140" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="269" y="188" font-size="13" font-weight="700" fill="#166534">Google</text>
    <text x="269" y="208" font-size="12" fill="#374151">Gemini 3.8 Flash</text>
    <text x="269" y="226" font-size="12" fill="#374151">Gemini 3.8 Flash Cyber</text>
    <text x="269" y="246" font-size="11" fill="#6b7280">$0.75 / $3.75 每百万 token</text>
    <text x="269" y="262" font-size="11" fill="#6b7280">（introductory，至 2026-12-31）</text>
    <text x="269" y="285" font-size="11" fill="#6b7280">Cyber 版经 Fairwind 计划门控</text>
  </g>

  <g>
    <rect x="480" y="165" width="250" height="140" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="494" y="188" font-size="13" font-weight="700" fill="#991b1b">OpenAI</text>
    <text x="494" y="208" font-size="12" fill="#374151">GPT-6 Astra</text>
    <text x="494" y="228" font-size="11" fill="#6b7280">$10 / $50 每百万 token</text>
    <text x="494" y="244" font-size="11" fill="#6b7280">首个被自评为网络安全「关键级」</text>
    <text x="494" y="260" font-size="11" fill="#6b7280">先经 Daybreak 企业计划开放</text>
    <text x="494" y="285" font-size="11" fill="#9ca3af">9/3 发布，9/4 正式公告</text>
  </g>

  <text x="24" y="326" font-size="11" fill="#9ca3af">共同模式：三家实验室的高危能力版本（Mythos 5.1 / Flash Cyber / Astra 网安能力）均采用「受限门控发放」，而非公开发布。</text>
